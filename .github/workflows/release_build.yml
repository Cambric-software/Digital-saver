name: Build Release (Android + Windows + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.1-beta)'
        required: false
        type: string

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app
          flutter pub get
          rm -f pubspec.lock
          flutter pub get
          flutter doctor -v

      - name: Build Android APK (Release)
        run: |
          cd app
          flutter build apk --release --verbose 2>&1 | tee build.log
          cat build.log

      - name: Rename APK
        run: |
          cd app/build/app/outputs/flutter-apk
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == refs/heads/* ]]; then
            VERSION="${{ inputs.release_version || 'dev' }}"
          fi
          mv app-release.apk "digital_saver_android_${VERSION}.apk"
          cp "digital_saver_android_${VERSION}.apk" digital_saver_android.apk
          ls -la

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/digital_saver_android*.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Check Visual Studio
        run: |
          Write-Host "Checking Visual Studio installation..."
          if (Get-Command vswhere -ErrorAction SilentlyContinue) {
            vswhere -products *
          } else {
            Write-Host "vswhere not found, checking common VS paths..."
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue
          }
          flutter doctor -v

      - name: Build Windows EXE (Release)
        run: |
          cd app
          flutter build windows --release 2>&1

      - name: Package Windows Build
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($VERSION) -or $VERSION.StartsWith("refs/heads/")) {
            $VERSION = "${{ inputs.release_version || 'dev' }}"
          }
          $srcDir = "app\build\windows\x64\runner\Release"
          $zipPath = "app\build\windows\x64\runner\Release\digital_saver_windows_$VERSION.zip"
          $latestZipPath = "app\build\windows\x64\runner\Release\digital_saver_windows.zip"
          
          Write-Host "Creating ZIP archive..."
          Compress-Archive -Path "$srcDir\*" -DestinationPath $zipPath -Force
          Copy-Item $zipPath $latestZipPath -Force

          choco install innosetup --no-progress -y
          $issPath = "app\build\windows\digital_saver.iss"
          @"
          [Setup]
          AppName=Digital Saver
          AppVersion=$VERSION
          AppPublisher=Cambric Software
          DefaultDirName={autopf}\Digital Saver
          DefaultGroupName=Digital Saver
          OutputDir=.
          OutputBaseFilename=digital_saver_windows_setup
          Compression=lzma
          SolidCompression=yes
          Uninstallable=yes
          [Files]
          Source: "x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autodesktop}\Digital Saver"; Filename: "{app}\digital_saver.exe"
          Name: "{group}\Digital Saver"; Filename: "{app}\digital_saver.exe"
          [Run]
          Filename: "{app}\digital_saver.exe"; Description: "Launch Digital Saver"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content $issPath
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
          Copy-Item "app\build\windows\digital_saver_windows_setup.exe" "app\build\windows\digital_saver_windows_setup_latest.exe" -Force
          
          Write-Host "ZIP contents:"
          Get-ChildItem $zipPath | Select-Object Name, @{N='Size (KB)';E={[math]::Round($_.Length/1KB,1)}}
          Write-Host "Source files:"
          Get-ChildItem $srcDir | Select-Object Name, @{N='Size (KB)';E={[math]::Round($_.Length/1KB,1)}}

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: app/build/windows/x64/runner/Release/digital_saver_windows*.zip
          retention-days: 30

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/build/windows/digital_saver_windows_setup*.exe
          retention-days: 30

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Enable Linux desktop support
        run: |
          cd app
          flutter config --enable-linux-desktop

      - name: Create Linux project
        run: |
          cd app
          flutter create --platforms=linux .

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Linux Release
        run: |
          cd app
          flutter build linux --release

      - name: Create Linux Archive
        run: |
          cd app/build/linux/x64/release/bundle
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == refs/heads/* ]]; then
            VERSION="${{ inputs.release_version || 'dev' }}"
          fi
          tar -czvf "digital_saver_linux_${VERSION}.tar.gz" *
          cp "digital_saver_linux_${VERSION}.tar.gz" digital_saver_linux.tar.gz
          mkdir -p installer/usr/lib/digital-saver installer/usr/share/applications installer/usr/share/icons/hicolor/256x256/apps
          rsync -a --exclude='installer' ./ installer/usr/lib/digital-saver/
          cp ../../../../../assets/digital-saver-icon-transparent.png installer/usr/share/icons/hicolor/256x256/apps/digital-saver.png
          cat > installer/usr/share/applications/digital-saver.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Digital Saver
          Comment=Private Veyro health monitor
          Exec=digital_saver
          Icon=digital-saver
          Terminal=false
          Categories=Utility;Education;
          DESKTOP
          cp installer/usr/share/applications/digital-saver.desktop installer/digital-saver.desktop
          cp installer/usr/share/icons/hicolor/256x256/apps/digital-saver.png installer/digital-saver.png
          cat > installer/AppRun <<'APP_RUN'
          #!/usr/bin/env bash
          set -e
          APP_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/digital-saver"
          mkdir -p "$APP_HOME"
          cp -r "${APPDIR}/usr/lib/digital-saver/." "$APP_HOME/"
          mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/applications"
          sed "s#Exec=digital_saver#Exec=$APP_HOME/digital_saver#" "${APPDIR}/usr/share/applications/digital-saver.desktop" > "${XDG_DATA_HOME:-$HOME/.local/share}/applications/digital-saver.desktop"
          chmod +x "$APP_HOME/digital_saver"
          if [ -d "$HOME/Desktop" ]; then cp "${XDG_DATA_HOME:-$HOME/.local/share}/applications/digital-saver.desktop" "$HOME/Desktop/Digital Saver.desktop"; chmod +x "$HOME/Desktop/Digital Saver.desktop"; fi
          exec "$APP_HOME/digital_saver" "$@"
          APP_RUN
          chmod +x installer/AppRun
          curl -L --fail -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage installer "digital_saver_linux_${VERSION}.AppImage"
          cp "digital_saver_linux_${VERSION}.AppImage" digital_saver_linux.AppImage
          cp "digital_saver_linux_${VERSION}.AppImage" digital_saver_linux_installer.run
          ls -la

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: app/build/linux/x64/release/bundle/digital_saver_linux*.tar.gz
          retention-days: 30

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            app/build/linux/x64/release/bundle/digital_saver_linux*.AppImage
            app/build/linux/x64/release/bundle/digital_saver_linux_installer.run
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Download Linux Archive
        uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: artifacts

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      - name: Download Linux Installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          files: artifacts/*
          body: "## Downloads\n\n### Android\n- **APK:** digital_saver_android_*.apk\n- Install on your Android phone (enable 'Install from unknown sources')\n\n### Windows\n- **ZIP:** digital_saver_windows_*.zip\n- Extract and run `digital_saver.exe`\n- Requires Windows 10/11 (64-bit)\n\n### Linux\n- **TAR.GZ:** digital_saver_linux_*.tar.gz\n- Extract and run `digital_saver`\n- Requires GTK3 libraries"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
