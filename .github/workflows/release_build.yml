name: Build Release (Android + Windows + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0-beta)'
        required: false
        type: string

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app
          flutter pub get
          rm -f pubspec.lock
          flutter pub get
          flutter doctor -v

      - name: Build Android APK (Release)
        run: |
          cd app
          flutter build apk --release --verbose 2>&1 | tee build.log
          cat build.log

      - name: Rename APK
        run: |
          cd app/build/app/outputs/flutter-apk
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == refs/heads/* ]]; then
            VERSION="${{ inputs.release_version || 'dev' }}"
          fi
          mv app-release.apk "digital_saver_android_${VERSION}.apk"
          ls -la

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/digital_saver_android_*.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Check Visual Studio
        run: |
          Write-Host "Checking Visual Studio installation..."
          if (Get-Command vswhere -ErrorAction SilentlyContinue) {
            vswhere -products *
          } else {
            Write-Host "vswhere not found, checking common VS paths..."
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue
          }
          flutter doctor -v

      - name: Build Windows EXE (Release)
        run: |
          cd app
          flutter build windows --release 2>&1

      - name: Package Windows Build
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($VERSION) -or $VERSION.StartsWith("refs/heads/")) {
            $VERSION = "${{ inputs.release_version || 'dev' }}"
          }
          $srcDir = "app\build\windows\x64\runner\Release"
          $zipPath = "app\build\windows\x64\runner\Release\digital_saver_windows_$VERSION.zip"
          
          Write-Host "Creating ZIP archive..."
          Compress-Archive -Path "$srcDir\*" -DestinationPath $zipPath -Force
          
          Write-Host "ZIP contents:"
          Get-ChildItem $zipPath | Select-Object Name, @{N='Size (KB)';E={[math]::Round($_.Length/1KB,1)}}
          Write-Host "Source files:"
          Get-ChildItem $srcDir | Select-Object Name, @{N='Size (KB)';E={[math]::Round($_.Length/1KB,1)}}

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: app/build/windows/x64/runner/Release/digital_saver_windows_*.zip
          retention-days: 30

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Linux Release
        run: |
          cd app
          flutter build linux --release

      - name: Create Linux Archive
        run: |
          cd app/build/linux/x64/release/bundle
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == refs/heads/* ]]; then
            VERSION="${{ inputs.release_version || 'dev' }}"
          fi
          tar -czvf "digital_saver_linux_${VERSION}.tar.gz" *
          ls -la

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: app/build/linux/x64/release/bundle/digital_saver_linux_*.tar.gz
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Download Linux Archive
        uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          files: artifacts/*
          body: "## Downloads\n\n### Android\n- **APK:** digital_saver_android_*.apk\n- Install on your Android phone (enable 'Install from unknown sources')\n\n### Windows\n- **ZIP:** digital_saver_windows_*.zip\n- Extract and run `digital_saver.exe`\n- Requires Windows 10/11 (64-bit)\n\n### Linux\n- **TAR.GZ:** digital_saver_linux_*.tar.gz\n- Extract and run `digital_saver`\n- Requires GTK3 libraries"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
