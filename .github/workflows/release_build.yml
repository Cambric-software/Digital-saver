name: Build Release (Android + Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0-beta)'
        required: false
        type: string

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app
          flutter pub get
          rm -f pubspec.lock
          flutter pub get
          flutter doctor -v

      - name: Build Android APK (Release)
        run: |
          cd app
          flutter build apk --release --verbose 2>&1 | tee build.log
          cat build.log

      - name: Rename APK
        run: |
          cd app/build/app/outputs/flutter-apk
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == refs/heads/* ]]; then
            VERSION="${{ inputs.release_version || 'dev' }}"
          fi
          mv app-release.apk "digital_saver_android_${VERSION}.apk"
          ls -la

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/digital_saver_android_*.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Check Visual Studio
        run: |
          Write-Host "Checking Visual Studio installation..."
          if (Get-Command vswhere -ErrorAction SilentlyContinue) {
            vswhere -products *
          } else {
            Write-Host "vswhere not found, checking common VS paths..."
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue
          }
          flutter doctor -v

      - name: Build Windows EXE (Release)
        run: |
          cd app
          flutter build windows --release 2>&1

      - name: Rename EXE
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($VERSION) -or $VERSION.StartsWith("refs/heads/")) {
            $VERSION = "${{ inputs.release_version || 'dev' }}"
          }
          $exePath = "app\build\windows\x64\runner\Release\digital_saver.exe"
          $newPath = "app\build\windows\x64\runner\Release\digital_saver_windows_$VERSION.exe"
          if (Test-Path $exePath) {
            Move-Item $exePath $newPath
            Get-ChildItem "app\build\windows\x64\runner\Release\digital_saver_windows_*"
          } else {
            Write-Host "EXE not found at expected path. Searching..."
            Get-ChildItem "app\build\windows\x64\runner\Release\" -Filter "*.exe"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/build/windows/x64/runner/Release/digital_saver_windows_*.exe
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          files: artifacts/*
          body: "## Downloads\n- **Android:** digital_saver_android_*.apk\n- **Windows:** digital_saver_windows_*.exe\n\n> For Windows, download and run the .exe file directly. No installation required."
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
