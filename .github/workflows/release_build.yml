name: Build Release (Android + Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0-beta)'
        required: false
        type: string

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app
          flutter pub get
          rm -f pubspec.lock
          flutter pub get

      - name: Build Android APK (Release)
        run: cd app && flutter build apk --release

      - name: Rename APK
        run: |
          cd app/build/app/outputs/flutter-apk
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == refs/heads/* ]]; then
            VERSION="${{ inputs.release_version || 'dev' }}"
          fi
          mv app-release.apk "digital_saver_android_${VERSION}.apk"
          ls -la

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/digital_saver_android_*.apk
          retention-days: 30

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          architecture: x64

      - name: Enable Windows desktop
        run: |
          flutter config --enable-windows-desktop

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Windows (Release)
        run: |
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          $env:CMAKE_GENERATOR_PLATFORM = "x64"
          flutter build windows --release

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "app/build/windows" -Force | Out-Null
          Compress-Archive -Path "app/build/windows/runner/Release" -DestinationPath "app/build/windows/digital_saver_windows.zip" -Force
          ls app/build/windows/

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: app/build/windows/digital_saver_windows.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
