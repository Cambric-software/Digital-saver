name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages accepts one deployment at a time. Two pushes landing close
# together used to start two deploys in the same minute and the second one
# failed inside actions/deploy-pages. Queue them instead of racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the same stable channel every other workflow uses. It was
          # hardcoded to 3.27.0, which is far older than the rest of the
          # project and could not build this code, so the Pages deploy failed
          # while desktop and mobile builds were fine.
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && flutter build web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
